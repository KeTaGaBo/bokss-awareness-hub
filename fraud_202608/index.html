<!DOCTYPE html>
<html lang="zh-HK">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>回報是真的，投資就是真的嗎？｜BOKSS Awareness Hub</title>

  <meta
    name="description"
    content="透過互動情境，學習識別投資騙局中的假冒身份、專業包裝、初期回報、追加投資及提款障礙。"
  >

  <!-- CSS：位於 fraud_202608/css/ -->
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/quiz.css">
  <link rel="stylesheet" href="css/result.css">
  <link rel="stylesheet" href="css/share-card.css">

  <!-- 共用頁尾程式 -->
  <script src="/js/shared-footer.js" defer></script>
</head>

<body>
  <div class="card" id="quizCard">

    <div class="topbar">
      <div>
        <div class="badge" id="badge"></div>
      </div>

      <div class="lang-box">
        <div class="lang-label" id="langLabel">
          Language / 語言 / 语言
        </div>

        <select id="langSelect" aria-label="Language / 語言 / 语言">
          <option value="zh-HK">繁體中文</option>
          <option value="zh-CN">简体中文</option>
          <option value="en">English</option>
        </select>
      </div>
    </div>

    <div class="hero-subtitle" id="heroSubtitle"></div>

    <h1 id="siteTitle"></h1>

    <div class="intro" id="intro"></div>

    <div id="questionArea">

      <div class="meta" id="meta"></div>

      <h2 class="question-title" id="title"></h2>

      <!-- Story / Scenario Mode -->
      <div id="storyCard" class="story-card">
        <div class="story-label" id="storyLabel"></div>
        <div class="story-title" id="storyTitle"></div>
        <div id="storyContent"></div>
      </div>

      <!-- 一般題目的 scenario，或 Story Mode 的實際問題 -->
      <div class="scenario" id="question"></div>

      <div class="question-type" id="questionType"></div>

      <div class="question-hint" id="questionHint"></div>

      <div id="answers"></div>

      <div
        class="answer-action"
        id="answerAction"
        style="display: none;"
      >
        <button
          id="checkBtn"
          class="action-btn"
          type="button"
        ></button>
      </div>

      <div id="result" class="result"></div>

    </div>

    <div class="controls">
      <button
        class="nav-btn primary"
        id="nextBtn"
        type="button"
      ></button>
    </div>

    <div class="summary" id="summary"></div>

    <div id="finalResult" class="result"></div>

    <!-- 保留給共用舊版 JavaScript 使用，避免找不到元素 -->
    <div id="footer" style="display: none;"></div>

    <div id="siteFooter" class="footer-note"></div>

  </div>

  <!-- 共用 JavaScript，載入次序不可調換 -->
  <script src="/js/quiz-core.js"></script>
  <script src="/js/quiz-render.js"></script>
  <script src="/js/result-share.js"></script>
  <script src="/js/main.js"></script>
</body>
</html>
